name: Runtime compatibility

on: [push, pull_request]

permissions:
  contents: read

jobs:
  core:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Restore Chrome app bundle on macOS
        if: runner.os == 'macOS'
        id: macchrome
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          chrome_bundle_root="$(dirname "$(dirname "$(dirname "$CHROME_PATH")")")"
          chrome_ci_app="$RUNNER_TEMP/Google Chrome for Testing.app"
          test -f "$chrome_bundle_root/Contents/Info.plist"
          ditto "$chrome_bundle_root" "$chrome_ci_app"
          printf 'chrome-path=%s/Contents/MacOS/%s\n' "$chrome_ci_app" "$(basename "$CHROME_PATH")" >> "$GITHUB_OUTPUT"
      - name: Allow sandboxed Chrome on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          test -x "$CHROME_PATH"
          sudo tee /etc/apparmor.d/webmcpify-ci-chrome >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile webmcpify-ci-chrome "${CHROME_PATH}" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/webmcpify-ci-chrome
      - run: npm test
        env:
          WEBMCPIFY_CHROME_BIN: ${{ steps.macchrome.outputs.chrome-path || steps.chrome.outputs.chrome-path }}
      - run: npm run verify:browser-state
        env:
          WEBMCPIFY_CHROME_BIN: ${{ steps.macchrome.outputs.chrome-path || steps.chrome.outputs.chrome-path }}

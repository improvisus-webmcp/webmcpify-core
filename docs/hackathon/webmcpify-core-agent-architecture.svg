<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">WebMCPify Core Agent architecture</title>
  <desc id="desc">A Strands agent coordinates WebMCPify Core through MCP, pauses for trusted human review, applies an approved patch, and verifies the result in a browser.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061d26"/><stop offset="1" stop-color="#0a3035"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#66e3c4"/><stop offset="1" stop-color="#b7ec68"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#001014" flood-opacity=".34"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66e3c4"/></marker>
    <style>
      .label{font:700 23px Inter,Arial,sans-serif;fill:#f4fbf8}.small{font:500 16px Inter,Arial,sans-serif;fill:#b8ceca}.step{font:700 14px Inter,Arial,sans-serif;letter-spacing:2px;fill:#66e3c4}.box{fill:#0d3940;stroke:#2c6668;stroke-width:2}.human{fill:#203b25;stroke:#b7ec68;stroke-width:3}.line{fill:none;stroke:#66e3c4;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <circle cx="1435" cy="90" r="250" fill="none" stroke="#66e3c4" stroke-opacity=".12" stroke-width="3"/>
  <text x="90" y="105" class="step">WEBMCPIFY · AGENTS FOR HUMANS</text>
  <text x="90" y="165" class="label" style="font-size:42px">From developer intent to verified WebMCP capability</text>
  <text x="90" y="205" class="small">Strands orchestrates. Core constrains. The person approves. The browser proves.</text>

  <g filter="url(#shadow)">
    <rect class="box" x="90" y="325" width="190" height="140" rx="20"/>
    <text x="120" y="365" class="step">01 · INTENT</text><text x="120" y="410" class="label">Developer</text><text x="120" y="440" class="small">Repository + URL</text>
    <rect class="box" x="340" y="325" width="215" height="140" rx="20"/>
    <text x="370" y="365" class="step">02 · PLAN</text><text x="370" y="410" class="label">Strands agent</text><text x="370" y="440" class="small">Agent loop</text>
    <rect class="box" x="615" y="325" width="215" height="140" rx="20"/>
    <text x="645" y="365" class="step">03 · ACT</text><text x="645" y="410" class="label">Core MCP</text><text x="645" y="440" class="small">Confined tools</text>
    <rect class="box" x="890" y="325" width="230" height="140" rx="20"/>
    <text x="920" y="365" class="step">04 · CHECK</text><text x="920" y="410" class="label">Draft + audit</text><text x="920" y="440" class="small">Disposable workspace</text>
    <rect class="human" x="1180" y="325" width="270" height="140" rx="20"/>
    <text x="1210" y="365" class="step">05 · DECIDE</text><text x="1210" y="410" class="label">Human review</text><text x="1210" y="440" class="small">Approve or reject</text>
  </g>
  <path class="line" d="M280 395 H330"/><path class="line" d="M555 395 H605"/><path class="line" d="M830 395 H880"/><path class="line" d="M1120 395 H1170"/>

  <g filter="url(#shadow)">
    <rect class="box" x="520" y="600" width="250" height="140" rx="20"/>
    <text x="550" y="640" class="step">06 · APPLY</text><text x="550" y="685" class="label">Exact patch</text><text x="550" y="715" class="small">Build or roll back</text>
    <rect class="box" x="840" y="600" width="270" height="140" rx="20"/>
    <text x="870" y="640" class="step">07 · VERIFY</text><text x="870" y="685" class="label">Real browser</text><text x="870" y="715" class="small">Independent evidence</text>
  </g>
  <path class="line" d="M1315 475 V540 H645 V590"/><path class="line" d="M770 670 H830"/>
  <path d="M1315 475 V790 H310" fill="none" stroke="#ef8f8f" stroke-width="3" stroke-dasharray="9 10" marker-end="url(#arrow)"/>
  <text x="1150" y="780" class="small" fill="#efb1b1">Rejected → stop unchanged</text>
  <rect x="90" y="805" width="1420" height="2" fill="url(#accent)" opacity=".7"/>
  <text x="90" y="850" class="small">Human approval is created outside the model. Apply rechecks the persisted manifest and patch identifier.</text>
</svg>

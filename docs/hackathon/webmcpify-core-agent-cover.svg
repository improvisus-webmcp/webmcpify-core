<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">WebMCPify Core Agent</title>
  <desc id="desc">Strands-powered WebMCP preparation with human approval and browser verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061c25"/><stop offset="1" stop-color="#0c3538"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#66e3c4"/><stop offset="1" stop-color="#b7ec68"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
    <style>.eyebrow{font:700 17px Inter,Arial,sans-serif;letter-spacing:3px;fill:#66e3c4}.title{font:750 72px Inter,Arial,sans-serif;fill:#f4fbf8}.body{font:500 24px Inter,Arial,sans-serif;fill:#bdd2ce}.chip{font:700 17px Inter,Arial,sans-serif;fill:#f4fbf8}.step{font:700 14px Inter,Arial,sans-serif;letter-spacing:1.5px;fill:#8ce9d3}</style>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <circle cx="1060" cy="30" r="245" fill="none" stroke="#66e3c4" stroke-opacity=".18" stroke-width="3"/>
  <circle cx="1050" cy="570" r="150" fill="#b7ec68" opacity=".07" filter="url(#blur)"/>
  <text x="80" y="90" class="eyebrow">IMPROVISUS · AGENTS FOR HUMANS</text>
  <text x="80" y="190" class="title">WebMCPify</text>
  <text x="80" y="270" class="title">Core Agent</text>
  <text x="80" y="320" class="body">Turn existing web applications into reviewed, secure,</text>
  <text x="80" y="355" class="body">browser-verified WebMCP capabilities.</text>
  <g transform="translate(80 430)">
    <rect width="190" height="68" rx="16" fill="#103d43" stroke="#2d696c"/><text x="24" y="27" class="step">STRANDS</text><text x="24" y="51" class="chip">orchestrates</text>
    <path d="M205 34h42" stroke="#66e3c4" stroke-width="4"/><path d="m247 34-13-8v16z" fill="#66e3c4"/>
    <rect x="260" width="190" height="68" rx="16" fill="#103d43" stroke="#2d696c"/><text x="284" y="27" class="step">CORE</text><text x="284" y="51" class="chip">constrains</text>
    <path d="M465 34h42" stroke="#66e3c4" stroke-width="4"/><path d="m507 34-13-8v16z" fill="#66e3c4"/>
    <rect x="520" width="190" height="68" rx="16" fill="#203b25" stroke="#b7ec68" stroke-width="2"/><text x="544" y="27" class="step">HUMAN</text><text x="544" y="51" class="chip">approves</text>
    <path d="M725 34h42" stroke="#66e3c4" stroke-width="4"/><path d="m767 34-13-8v16z" fill="#66e3c4"/>
    <rect x="780" width="220" height="68" rx="16" fill="#103d43" stroke="#2d696c"/><text x="804" y="27" class="step">BROWSER</text><text x="804" y="51" class="chip">proves</text>
  </g>
  <rect x="80" y="580" width="1040" height="3" fill="url(#glow)"/>
  <text x="80" y="625" class="body" style="font-size:19px">github.com/improvisus-webmcp/webmcpify-core</text>
</svg>
